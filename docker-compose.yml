version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bumdes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bumdes_banyubening
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bumdes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bumdes-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bumdes_banyubening?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
      PORT: 4000
      JWT_SECRET: "super-secret-jwt-production-change-me-32chars!!"
      JWT_REFRESH_SECRET: "super-secret-refresh-production-change-me-32chars!!"
      PIN_CODE: "123456"
      CORS_ORIGIN: "http://localhost:3000"
      UPLOAD_DIR: "./uploads"
      BACKUP_DIR: "./backups"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bumdes-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_backups:
