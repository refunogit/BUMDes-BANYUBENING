[project]
name = "automated-comic-translator-backend"
version = "1.0.0"
description = "FastAPI backend for the Automated Comic Translator Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    "opencv-python>=4.9",
    "numpy>=1.26,<3",
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
ml = [
    "paddlepaddle>=2.6.1",
    "paddleocr>=2.7.3",
    "simple-lama-inpainting",
    "torch",
]
onnx = ["onnxruntime>=1.18"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
