<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automated Comic Translator</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="act-pop-header">
      <div class="act-pop-logo">💬</div>
      <div>
        <h1 class="act-pop-title">Comic Translator</h1>
        <p class="act-pop-subtitle">One-click in-place translation</p>
      </div>
    </header>

    <main class="act-pop-body">
      <!-- Master switch -->
      <label class="act-row act-row--switch">
        <div>
          <div class="act-row-label">Enable extension</div>
          <div class="act-row-desc">Show Translate buttons over comic images</div>
        </div>
        <input type="checkbox" id="enabled" class="act-switch" />
      </label>

      <!-- Target language -->
      <div class="act-field">
        <label class="act-row-label" for="targetLang">Target language</label>
        <select id="targetLang" class="act-select">
          <option value="id">Indonesian</option>
          <option value="en">English</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh-CN">Chinese (Simplified)</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="pt">Portuguese</option>
          <option value="de">German</option>
          <option value="vi">Vietnamese</option>
          <option value="th">Thai</option>
        </select>
      </div>

      <!-- Source language -->
      <div class="act-field">
        <label class="act-row-label" for="sourceLang">Source language</label>
        <select id="sourceLang" class="act-select">
          <option value="auto">Auto-detect</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh-CN">Chinese</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="act-pop-actions">
        <button id="saveBtn" class="act-btn-primary" type="button">Save settings</button>
        <button id="resetBtn" class="act-btn-ghost" type="button">Reset</button>
      </div>

      <p id="statusMsg" class="act-pop-status" role="status"></p>
    </main>

    <footer class="act-pop-footer">
      <span>Backend: <code>http://localhost:8000</code></span>
    </footer>

    <script src="./popup.js"></script>
  </body>
</html>
